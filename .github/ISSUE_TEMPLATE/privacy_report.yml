name: Privacy or security concern
description: Report a possible privacy, secret, or security problem without exposing private data.
title: "[Security] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, tokens, student names, student numbers, real score workbooks, real teaching syllabi, local databases, or private report exports into this public issue.

        If the issue requires sensitive evidence, describe the risk at a high level and contact the repository owner privately.
  - type: dropdown
    id: category
    attributes:
      label: Concern type
      options:
        - Possible secret exposure
        - Private teaching data exposure
        - AI privacy risk
        - Unsafe file upload or path handling
        - Dependency vulnerability
        - Other security concern
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Safe summary
      description: Explain the risk without including private values or files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction outline
      description: List the general steps or affected area. Use placeholders instead of real data.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include API keys, tokens, student identifiers, real course files, databases, or private screenshots.
          required: true
