name: Security Audit

on:
  pull_request:
    paths:
      - ".github/workflows/security.yml"
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/package_release.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security.yml"
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/package_release.sh"
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r backend/requirements.txt pip-audit
          python -m pip_audit --local

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev

  package-privacy-audit:
    name: Package privacy audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sanitized package
        run: ./scripts/package_release.sh
